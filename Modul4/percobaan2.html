<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 2 - For Loop</title>
</head>

<body>

    <h1>Percobaan 2</h1>
    <h2>Perulangan For Loop</h2>

    <div id="hasil"></div>

    <script>
        let hasil = "";

        for (let i = 1; i <= 10; i++) {
            hasil += "Perulangan ke-" + i + "<br>";
        }

        document.getElementById("hasil").innerHTML = hasil;
    </script>

</body>
</html>
