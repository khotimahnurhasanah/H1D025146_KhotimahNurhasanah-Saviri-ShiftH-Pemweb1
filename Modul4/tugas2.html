<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .calculator {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        .tombol {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 11px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #hasil {
            margin-top: 25px;
            padding: 15px;
            background-color: #f1f8ff;
            text-align: center;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Kalkulator</h1>

        <label for="angka1">Angka Pertama:</label>
        <input type="number" id="angka1">

        <label for="angka2">Angka Kedua:</label>
        <input type="number" id="angka2">

        <div class="tombol">

            <button onclick="hitung('+')">
                +
            </button>

            <button onclick="hitung('-')">
                -
            </button>

            <button onclick="hitung('*')">
                ×
            </button>

            <button onclick="hitung('/')">
                ÷
            </button>

        </div>

        <div id="hasil">
            Hasil: -
        </div>

    </div>

    <script>
        function hitung(operator) {

            let angka1 = Number(document.getElementById("angka1").value);
            let angka2 = Number(document.getElementById("angka2").value);
            let hasil;

            if (
                document.getElementById("angka1").value === "" ||
                document.getElementById("angka2").value === ""
            ) {
                document.getElementById("hasil").innerHTML =
                    "Masukkan kedua angka terlebih dahulu.";
                return;
            }

            if (operator === "+") {
                hasil = angka1 + angka2;
            }

            else if (operator === "-") {
                hasil = angka1 - angka2;
            }

            else if (operator === "*") {
                hasil = angka1 * angka2;
            }

            else if (operator === "/") {

                if (angka2 === 0) {
                    document.getElementById("hasil").innerHTML =
                        "Tidak dapat membagi dengan 0.";
                    return;
                }

                hasil = angka1 / angka2;
            }

            document.getElementById("hasil").innerHTML =
                "Hasil: " + hasil;
        }
    </script>

</body>
</html>
