<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 3 - Button Click</title>
</head>

<body>

    <h1>Percobaan 3</h1>
    <h2>Button Click Event dan Alert</h2>

    <button onclick="tampilkanPesan()">Klik Saya</button>

    <script>
        function tampilkanPesan() {
            alert("Halo! Tombol berhasil diklik.");
        }
    </script>

</body>
</html>
