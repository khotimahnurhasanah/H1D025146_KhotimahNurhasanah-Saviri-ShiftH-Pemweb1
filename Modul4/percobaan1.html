<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 1 - Variabel dan Output</title>
</head>

<body>

    <h1>Percobaan 1</h1>
    <h2>Variabel dan Output JavaScript</h2>

    <p id="hasil"></p>

    <script>
        // Deklarasi variabel menggunakan let
        let nama = "Hasanah";
        let umur = 19;

        // Deklarasi konstanta menggunakan const
        const prodi = "Informatika";

        // Menampilkan hasil ke halaman HTML
        document.getElementById("hasil").innerHTML =
            "Nama: " + nama + "<br>" +
            "Umur: " + umur + " tahun<br>" +
            "Program Studi: " + prodi;
    </script>

</body>
</html>
