<!DOCTYPE html>
<html>
<head>
    <title>Form Data Mahasiswa</title>
    <link rel="stylesheet" href="tugas.css">
</head>

<body>

    <div class="container">

        <h1>Form Data Mahasiswa</h1>

        <p class="subtitle">
            Silakan isi data mahasiswa dengan lengkap
        </p>

        <form>

            <table>

                <tr>
                    <td>Nama</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="nama"
                               placeholder="Masukkan nama">
                    </td>
                </tr>

                <tr>
                    <td>NIM</td>
                    <td>:</td>
                    <td>
                        <input type="text" name="nim"
                               placeholder="Masukkan NIM">
                    </td>
                </tr>

                <tr>
                    <td>Program Studi</td>
                    <td>:</td>
                    <td>
                        <select name="prodi">
                            <option>-- Pilih Program Studi --</option>
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="jk">
                        Laki-laki

                        <input type="radio" name="jk">
                        Perempuan
                    </td>
                </tr>

                <tr>
                    <td>Hobi</td>
                    <td>:</td>
                    <td>
                        <input type="checkbox"> Membaca
                        <input type="checkbox"> Olahraga
                        <input type="checkbox"> Musik
                    </td>
                </tr>

                <tr>
                    <td>Alamat</td>
                    <td>:</td>
                    <td>
                        <textarea
                            rows="4"
                            placeholder="Masukkan alamat"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="3" class="button">
                        <input type="submit"
                               value="Kirim"
                               id="btnKirim">

                        <input type="reset"
                               value="Cancel"
                               id="btnCancel">
                    </td>
                </tr>

            </table>

        </form>

        <p class="footer">
            Praktikum CSS | Informatika
        </p>

    </div>

</body>
</html>
