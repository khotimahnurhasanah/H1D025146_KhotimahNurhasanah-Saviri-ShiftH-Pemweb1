<!DOCTYPE html>
<html>
    <head>
        <title>Percobaan 5 - List</title>
    </head>
    <body>
        <p>Unordered List (lingkaran)</p>
        <ul type='circle'>
            <li>Sunday</li>
            <li>Monday</li>
            <li>Tuesday</li>
        </ul>

        <p>Unordered List (kotak)</p>
        <ul type='square'>
            <li>Sunday</li>
            <li>Monday</li>
            <li>Tuesday</li>
        </ul>

        <p>Ordered List (angka)</p>
        <ol type='1'>
            <li>Sunday</li>
            <li>Monday</li>
            <li>Tuesday</li>
        </ol>
    </body>
</html>
